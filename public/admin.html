<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 ALONE BHAI - VIP KEY ADMIN PANEL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .panel-card {
      width: 100%;
      max-width: 450px;
      background: #0b1120;
      border: 2px solid #00ff88;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.3);
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid #00ff88;
      color: #00ff88;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    p.sub {
      font-size: 11px;
      color: #8899a6;
      margin-bottom: 20px;
    }
    .label {
      text-align: left;
      font-size: 11px;
      color: #00ff88;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    .grid-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .duration-btn {
      background: #101a2e;
      border: 1px solid #1f2f4d;
      color: #a0aec0;
      padding: 10px 5px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .duration-btn.active, .duration-btn:hover {
      background: #00ff88;
      color: #000000;
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }
    .output-box {
      background: #03060d;
      border: 2px dashed #00ff88;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .key-text {
      font-size: 15px;
      font-weight: bold;
      color: #00ff88;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color: #000;
      font-weight: 900;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      margin-bottom: 10px;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .copy-btn {
      background: #1a2638;
      color: #00ff88;
      border: 1px solid #00ff88;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
    }
    .master-keys {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 10px;
      color: #718096;
      text-align: left;
    }
    .master-keys code {
      color: #f6ad55;
      background: #1a202c;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="panel-card">
    <div class="badge">👑 ADMIN KEY GENERATOR</div>
    <h1>🦋⃟≛⃝🇦𝒍𝒐𝒏𝒆≛⃝❤️࿐ VIP PANEL</h1>
    <p class="sub">Generate Time-Based Access Keys for Users</p>

    <span class="label">SELECT DURATION:</span>
    <div class="grid-btns">
      <button class="duration-btn" onclick="selectDur('1H', this)">1 HOUR</button>
      <button class="duration-btn active" onclick="selectDur('1D', this)">1 DAY</button>
      <button class="duration-btn" onclick="selectDur('7D', this)">7 DAYS</button>
      <button class="duration-btn" onclick="selectDur('30D', this)">30 DAYS</button>
      <button class="duration-btn" onclick="selectDur('PERM', this)">LIFETIME</button>
    </div>

    <button class="action-btn" onclick="generateNewKey()">⚡ GENERATE NEW VIP KEY ⚡</button>

    <div class="output-box">
      <div class="key-text" id="keyDisplay">CLICK GENERATE ABOVE</div>
      <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 COPY KEY TO CLIPBOARD</button>
    </div>

    <div class="master-keys">
      <b>MASTER LIFETIME KEYS:</b><br>
      <code>ALONE-VIP-2026</code> <code>ALONE-BHAI-2026</code> <code>ALONE-777</code>
    </div>
  </div>

  <script>
    const SECRET_SALT = "ALONE_BHAI_SECRET_SALT_2026";
    let selectedDuration = '1D';

    function computeKeyHash(payload) {
      let hash = 0;
      const str = payload + SECRET_SALT;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = (hash << 5) - hash + char;
        hash |= 0;
      }
      return Math.abs(hash).toString(16).toUpperCase().padStart(4, '0').slice(-4);
    }

    function selectDur(dur, el) {
      selectedDuration = dur;
      document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function generateNewKey() {
      const timestamp = Math.floor(Date.now() / 1000);
      const payload = `ALONE-${selectedDuration}-${timestamp}`;
      const hash = computeKeyHash(payload);
      const fullKey = `${payload}-${hash}`;
      
      document.getElementById('keyDisplay').innerText = fullKey;
      document.getElementById('copyBtn').innerText = '📋 COPY KEY TO CLIPBOARD';
    }

    function copyKey() {
      const txt = document.getElementById('keyDisplay').innerText;
      if (!txt || txt.includes('CLICK GENERATE')) return;
      
      navigator.clipboard.writeText(txt).then(() => {
        document.getElementById('copyBtn').innerText = '✅ COPIED SUCCESSFULLY!';
        setTimeout(() => {
          document.getElementById('copyBtn').innerText = '📋 COPY KEY TO CLIPBOARD';
        }, 2000);
      });
    }

    // Generate initial key on load
    generateNewKey();
  </script>
</body>
</html>
